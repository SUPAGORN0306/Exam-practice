<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" id="metaThemeColor" />
  <title>Smart Practice — ฝึกทำข้อสอบ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Apply theme before first paint to avoid flash
    (function () {
      try {
        var raw = localStorage.getItem('examapp:v1:settings');
        var theme = 'system';
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.theme) theme = s.theme;
        }
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#12151C' : '#F7F8FA');
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">Smart Practice</h1>
      <button id="themeToggle" class="icon-btn" aria-label="สลับธีม">◐</button>
    </header>

    <main id="main" class="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <a href="#/home" data-route="home" class="nav-item">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span class="nav-label">หน้าแรก</span>
      </a>
      <a href="#/stats" data-route="stats" class="nav-item">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span class="nav-label">สถิติ</span>
      </a>
      <a href="#/manage" data-route="manage" class="nav-item">
        <span class="nav-icon" aria-hidden="true">✎</span>
        <span class="nav-label">ข้อสอบ</span>
      </a>
      <a href="#/settings" data-route="settings" class="nav-item">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span class="nav-label">ตั้งค่า</span>
      </a>
    </nav>
  </div>

  <script src="data/subjects.js"></script>
  <script src="data/sample-questions.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/askai.js"></script>

  <script src="js/views/home.js"></script>
  <script src="js/views/session.js"></script>
  <script src="js/views/summary.js"></script>
  <script src="js/views/statsView.js"></script>
  <script src="js/views/manage.js"></script>
  <script src="js/views/settings.js"></script>

  <script src="js/app.js"></script>

  <script>
    // Register service worker only on http(s)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* silent */ });
      });
    }
  </script>
</body>
</html>
